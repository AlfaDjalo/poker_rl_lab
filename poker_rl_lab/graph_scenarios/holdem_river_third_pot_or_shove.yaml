name: holdem_river_third_pot_or_shove
description: >
  Heads-up Hold'em river-only, run on the real `holdem` engine variant.
  Graph plays passively to the river, then pot is overridden to 100 chips
  with 100 behind each seat (SPR = 1). Sizing menu: 1/3 pot or all-in.
  Self-play, single BETTING node in scope.

engine_variant: holdem
num_seats: 2

stack:
  mode: fixed_bb
  stack_bb: 75.0          # only needs to cover the passive pre-river check-through
  big_blind_size: 2
  small_blind_size: 1
  fixed_dealer_position: 1

start:
  node_id: bet_river
  pot_bb: 50.0            # 100 chips
  stack_behind_bb: 50.0   # 100 chips behind each seat

scope:
  domains: [BETTING]
  node_ids: [bet_river]

action_abstraction:
  BETTING:
    bet_fractions: [0.3333]   # 0.3333 * pot(100) = 33
    include_all_in: true
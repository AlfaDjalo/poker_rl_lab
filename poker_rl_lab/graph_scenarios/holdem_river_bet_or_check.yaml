name: holdem_river_bet_or_check
description: >
  Heads-up Hold'em river-only bet-or-check trainer, run on the REAL
  `holdem` engine variant (no purpose-built river variant in the Engine).
  On reset the env plays the graph forward from preflop, auto-checking/
  calling every street before the river (no policy involvement, nothing
  recorded in history), then overrides the pot to 100 chips with exactly
  100 behind each seat (SPR = 1) -- see `start:` below. The first actor
  can check or choose a one-third-pot bet or a pot-sized all-in; whoever
  faces a bet can only call or fold. Self-play, single
  BETTING node in scope. Identical in structure to
  omaha_river_bet_or_check.yaml; only the engine variant differs.

engine_variant: holdem
num_seats: 2

stack:
  mode: fixed_bb
  # Initial stacks only need to cover the passive preflop/flop/turn
  # check-through; they are overridden at the river (start.stack_behind_bb).
  stack_bb: 75.0
  big_blind_size: 2
  small_blind_size: 1
  # Fixed dealer => stable physical seat roles across hands (required by
  # a per-seat DualSeatActorCritic -- see graph_training_loop.py).
  fixed_dealer_position: 1

start:
  node_id: bet_river
  pot_bb: 50.0            # 100 chips at big_blind_size 2 (50 each)
  stack_behind_bb: 50.0   # 100 chips behind each seat

scope:
  domains: [BETTING]
  node_ids: [bet_river]

action_abstraction:
  BETTING:
    bet_fractions: [0.33, 1.0]
    include_all_in: true
name: holdem_turn_river_034_third_shove
description: >
  Heads-up Hold'em, turn and river. The turn is 3/4 pot or check, and the
  river is 1/3 pot, all-in, or check. Neither street allows raises: after
  a bet the opponent can only call or fold. Runs on the real `holdem`
  variant: the graph plays passively to the turn, then the pot and stacks
  are overridden (pot 50, 200 behind each seat).

engine_variant: holdem
num_seats: 2

stack:
  mode: fixed_bb
  stack_bb: 75.0
  big_blind_size: 2
  small_blind_size: 1
  fixed_dealer_position: 1

start:
  node_id: bet_turn
  pot_bb: 25.0            # 50 chips
  stack_behind_bb: 100.0  # 200 chips behind each seat

scope:
  domains: [BETTING]
  node_ids: [bet_turn, bet_river]

action_abstraction:
  BETTING:                # fallback only; both nodes are overridden below
    bet_fractions: [0.75]
    include_all_in: false
    allow_raise: false

node_action_abstraction:
  bet_turn:
    bet_fractions: [0.75]
    include_all_in: false
    allow_raise: false
  bet_river:
    bet_fractions: [0.3333]
    include_all_in: true
    allow_raise: false
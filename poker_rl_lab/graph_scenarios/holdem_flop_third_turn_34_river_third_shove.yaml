name: holdem_flop_third_turn_34_river_third_shove
description: >
  Heads-up Hold'em from the flop. Flop: 1/3 pot or check. Turn: 3/4 pot or
  check. River: 1/3 pot, all-in, or check. No raises on any street: after a
  bet the opponent can only call or fold. Runs on the real `holdem` variant:
  the graph plays passively through preflop, then the pot and stacks are
  overridden (pot 50, 200 behind each seat).

engine_variant: holdem
num_seats: 2

stack:
  mode: fixed_bb
  stack_bb: 75.0
  big_blind_size: 2
  small_blind_size: 1
  fixed_dealer_position: 1

start:
  node_id: bet_flop
  pot_bb: 25.0            # 50 chips
  stack_behind_bb: 100.0  # 200 chips behind each seat

scope:
  domains: [BETTING]
  node_ids: [bet_flop, bet_turn, bet_river]

action_abstraction:
  BETTING:                # fallback only; all three nodes are overridden below
    bet_fractions: [0.3333]
    include_all_in: false
    allow_raise: false

node_action_abstraction:
  bet_flop:
    bet_fractions: [0.3333]
    include_all_in: false
    allow_raise: false
  bet_turn:
    bet_fractions: [0.75]
    include_all_in: false
    allow_raise: false
  bet_river:
    bet_fractions: [0.3333]
    include_all_in: true
    allow_raise: false
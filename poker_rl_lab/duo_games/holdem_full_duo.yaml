name: holdem_full_duo
description: >
  A COMPLETE heads-up hold'em hand: preflop, flop, turn, and river all
  have a real betting round, unlike river_duo.yaml/turn_river_duo.yaml
  which start mid-hand. Blinds are posted (sb = button, per this
  codebase's established heads-up convention — see
  representation/position_encoder.py), the board is revealed
  progressively (flop, then turn, then river) as each street is
  reached, not all at once.

  LIMITATION (inherent to DuoGameConfig's fixed-tree schema, not
  specific to this file): each street allows at most one bet and one
  call/fold — no re-raises. Every betting round therefore resolves
  with SB and BB's committed chips exactly equal before the next
  street's deal node fires, which is what makes a fixed, finite node
  graph possible at all. For genuine unlimited re-raising across
  streets, use envs.multi_street_env.MultiStreetEnv +
  scenarios.preflop_scenario_generator.PreflopScenarioGenerator
  instead (see experiments/multi_street_experiment.py) — this file is
  the "whole hand, capped aggression" middle ground that plugs
  straight into the existing GenericTreeEnv/DuoGameConfig training
  pipeline with zero code changes.

  Preflop: SB may fold, call (limp), or raise pot. If SB limps, BB
  gets the option to check or raise pot ("big blind option"); either
  way, whoever faces a raise may only call or fold. Postflop (flop/
  turn/river): BB acts first each street (SB is the button, so SB is
  last to act postflop, as in real heads-up play) — check or bet pot;
  if BB checks, SB may check or bet pot; whoever faces a bet may only
  call or fold.

game_name: holdem
small_blind: 1
big_blind: 2

seats:
  - id: sb
    acts_first: true
  - id: bb
    acts_first: false

dealer_seat: sb

stack:
  mode: fixed_bb
  stack_bb: 100.0

pot:
  mode: blinds

deal:
  street_index: 0
  hole_cards_per_player: 2
  node_count: 5
  deal_board: true
  reveal_at_start: false

start_node: preflop_sb

nodes:
  # ---------------- Preflop ----------------
  preflop_sb:
    seat: sb
    actions:
      FOLD: terminal_fold_sb
      CALL: preflop_bb_option
      BET_100: preflop_sb_raise

  preflop_bb_option:
    seat: bb
    actions:
      CHECK: deal_flop
      BET_100: preflop_bb_raise_after_limp

  preflop_bb_raise_after_limp:
    seat: sb
    actions:
      CALL: deal_flop
      FOLD: terminal_fold_sb

  preflop_sb_raise:
    seat: bb
    actions:
      CALL: deal_flop
      FOLD: terminal_fold_bb

  # ---------------- Flop ----------------
  deal_flop:
    type: deal
    node_indices: [0, 1, 2]
    next: flop_bb

  flop_bb:
    seat: bb
    actions:
      CHECK: flop_sb_option
      BET_100: flop_bb_bet

  flop_sb_option:
    seat: sb
    actions:
      CHECK: deal_turn
      BET_100: flop_sb_bet_after_check

  flop_sb_bet_after_check:
    seat: bb
    actions:
      CALL: deal_turn
      FOLD: terminal_fold_bb

  flop_bb_bet:
    seat: sb
    actions:
      CALL: deal_turn
      FOLD: terminal_fold_sb

  # ---------------- Turn ----------------
  deal_turn:
    type: deal
    node_indices: [3]
    next: turn_bb

  turn_bb:
    seat: bb
    actions:
      CHECK: turn_sb_option
      BET_100: turn_bb_bet

  turn_sb_option:
    seat: sb
    actions:
      CHECK: deal_river
      BET_100: turn_sb_bet_after_check

  turn_sb_bet_after_check:
    seat: bb
    actions:
      CALL: deal_river
      FOLD: terminal_fold_bb

  turn_bb_bet:
    seat: sb
    actions:
      CALL: deal_river
      FOLD: terminal_fold_sb

  # ---------------- River ----------------
  deal_river:
    type: deal
    node_indices: [4]
    next: river_bb

  river_bb:
    seat: bb
    actions:
      CHECK: river_sb_option
      BET_100: river_bb_bet

  river_sb_option:
    seat: sb
    actions:
      CHECK: terminal_check_check
      BET_100: river_sb_bet_after_check

  river_sb_bet_after_check:
    seat: bb
    actions:
      CALL: terminal_showdown
      FOLD: terminal_fold_bb

  river_bb_bet:
    seat: sb
    actions:
      CALL: terminal_showdown
      FOLD: terminal_fold_sb

terminals:
  terminal_check_check:
    type: showdown
  terminal_showdown:
    type: showdown
  terminal_fold_sb:
    type: fold
    folder: sb
  terminal_fold_bb:
    type: fold
    folder: bb